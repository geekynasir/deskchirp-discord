<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer Presence · Discord card concept</title>
<style>
/* Product-specific tokens. color-scheme is set from the host's actual background (see script), never from prefers-color-scheme alone. */
#dp {
  --dp-fg: light-dark(#1d1d1f, #ececee);
  --dp-muted: light-dark(#585a60, #a6a8ae);
  --dp-panel: light-dark(#ffffff, #161618);
  --dp-field: light-dark(#f3f3f5, #222327);
  --dp-line: light-dark(#dcdde1, #303136);
  --dp-seg-on: light-dark(#ffffff, #3a3b41);
  --dp-ring: light-dark(#3b5bdb, #8ea2ff);
  --dp-warn: light-dark(#8a4b00, #f0b232);
  --dp-dot: light-dark(rgba(0,0,0,.13), rgba(255,255,255,.09));
  --dp-tag: light-dark(#eceef1, #2a2b30);
  --dc-card: light-dark(#ffffff, #1c1d21);
  --dc-border: light-dark(#e1e2e6, #2e2f35);
  --dc-text: light-dark(#060607, #f2f3f5);
  --dc-sub: light-dark(#2e3035, #dbdee1);
  --dc-muted: light-dark(#5c5e66, #949ba4);
  --dc-green: light-dark(#1a7f45, #23a55a);
  --dc-btn: light-dark(#e3e4e8, #393a40);
  --dc-btn-text: light-dark(#2e3035, #f2f3f5);
  --dc-online: #23a55a;
  color: var(--dp-fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  width: 100%;
}
#dp * { box-sizing: border-box; }
#dp [hidden] { display: none !important; }
#dp h2 { margin: 0; font-size: 15px; font-weight: 600; }
#dp p { margin: 0; }
#dp .dp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 12px; }
#dp .dp-chip { font-size: 12px; color: var(--dp-muted); background: var(--dp-tag); border-radius: 999px; padding: 2px 9px; }
#dp .dp-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 18px; align-items: start; }

/* Companion settings (native-settings feel) */
#dp .dp-config { background: var(--dp-panel); border: 1px solid var(--dp-line); border-radius: 12px; padding: 4px 14px; margin: 0; }
#dp .dp-group { border: 0; margin: 0; padding: 12px 0; min-width: 0; }
#dp .dp-group + .dp-group { border-top: 1px solid var(--dp-line); }
#dp legend, #dp .dp-label { padding: 0; font-size: 12px; font-weight: 600; color: var(--dp-muted); margin-bottom: 6px; display: block; }
#dp legend { float: left; width: 100%; }
#dp legend + * { clear: both; }
#dp .dp-hint { font-size: 12px; color: var(--dp-muted); margin-top: 6px; }
#dp .dp-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--dp-field); border-radius: 8px; padding: 2px; gap: 2px; }
#dp .dp-seg label { position: relative; display: block; }
#dp .dp-seg input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; }
#dp .dp-seg span { display: block; text-align: center; padding: 5px 4px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
#dp .dp-seg input:checked + span { background: var(--dp-seg-on); box-shadow: 0 1px 2px rgba(0,0,0,.18); font-weight: 600; }
#dp .dp-seg input:focus-visible + span { outline: 2px solid var(--dp-ring); outline-offset: 1px; }
#dp .dp-seg input:disabled + span { color: var(--dp-muted); opacity: .6; }
#dp .dp-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#dp select { width: 100%; font: inherit; font-size: 13px; color: var(--dp-fg); background: var(--dp-field); border: 1px solid var(--dp-line); border-radius: 7px; padding: 6px 8px; min-height: 32px; }
#dp .dp-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; }
#dp .dp-check { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; }
#dp .dp-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--dp-ring); flex: none; }
#dp .dp-check small { color: var(--dp-muted); font-size: 12px; }

/* Preview */
#dp .dp-preview { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
#dp .dp-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#dp .dp-bar label { font-size: 12px; font-weight: 600; color: var(--dp-muted); white-space: nowrap; }
#dp .dp-bar select { width: auto; max-width: 62%; }
#dp .dp-stage { border-radius: 12px; padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  background-image: radial-gradient(var(--dp-dot) 1px, transparent 1.2px); background-size: 14px 14px; }

/* Discord activity card (mock, matches profile "Playing" card) */
#dp .dc { font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--dc-text); }
#dp .dc-card { width: min(100%, 316px); background: var(--dc-card); border: 1px solid var(--dc-border); border-radius: 10px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#dp .dc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
#dp .dc-type { font-size: 12px; font-weight: 600; color: var(--dc-sub); }
#dp .dc-more { color: var(--dc-muted); letter-spacing: 1px; font-weight: 700; line-height: 1; }
#dp .dc-act { display: flex; gap: 12px; align-items: center; }
#dp .dc-art { position: relative; flex: none; width: 64px; height: 64px; }
#dp .dc-large { width: 64px; height: 64px; border-radius: 12px; display: block; object-fit: contain; }
#dp .dc-large.is-claude { background: #f4ede4; padding: 11px; }
#dp .dc-large.is-codex { background: #0d0d0d; padding: 11px; }
#dp .dc-small { position: absolute; right: -5px; bottom: -5px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--dc-card); display: grid; place-items: center; overflow: hidden; }
#dp .dc-small img { width: 100%; height: 100%; object-fit: contain; display: block; }
#dp .dc-small.b-claude { background: #f4ede4; padding: 3px; }
#dp .dc-small.b-working { background: #23a55a; }
#dp .dc-small.b-attention { background: #f0b232; }
#dp .dc-small.b-idle { background: #80848e; }
#dp .dc-small svg { width: 14px; height: 14px; display: block; }
#dp .dc-text { min-width: 0; flex: 1; }
#dp .dc-name { font-size: 15px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dp .dc-line { font-size: 13px; line-height: 1.35; color: var(--dc-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dp .dc-line.is-cut { text-decoration: underline wavy var(--dp-warn); text-underline-offset: 3px; }
#dp .dc-time { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--dc-green); font-variant-numeric: tabular-nums; }
#dp .dc-time svg { width: 16px; height: 16px; flex: none; }
#dp .dc-btns { display: grid; gap: 8px; margin-top: 12px; }
#dp .dc-btns:empty { display: none; }
#dp .dc-btn { display: block; text-align: center; font-size: 14px; font-weight: 500; padding: 7px 10px; border-radius: 8px; background: var(--dc-btn); color: var(--dc-btn-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dp .dc-member { width: min(100%, 316px); display: flex; align-items: center; gap: 10px; background: var(--dc-card); border: 1px solid var(--dc-border); border-radius: 8px; padding: 7px 10px; }
#dp .dc-avatar { position: relative; flex: none; width: 32px; height: 32px; border-radius: 50%; background: #5865f2; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
#dp .dc-avatar::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dc-online); border: 3px solid var(--dc-card); }
#dp .dc-mtext { min-width: 0; font-size: 12px; color: var(--dc-muted); line-height: 1.3; }
#dp .dc-mtext b { color: var(--dc-sub); font-weight: 600; }
#dp .dc-mname { font-size: 14px; font-weight: 600; color: var(--dc-text); }

#dp .dp-fit { font-size: 12px; color: var(--dp-warn); }
#dp .dp-legend { font-size: 12px; color: var(--dp-muted); }
#dp .dp-legend b { color: var(--dp-fg); font-weight: 600; }
#dp details { border: 1px solid var(--dp-line); border-radius: 10px; background: var(--dp-panel); }
#dp summary { padding: 8px 12px; font-size: 13px; font-weight: 600; }
#dp dl { margin: 0; padding: 0 12px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; font-size: 12px; }
#dp dt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--dp-muted); padding-top: 1px; }
#dp dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
#dp .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; background: var(--dp-tag); color: var(--dp-muted); white-space: nowrap; }
#dp .tag.shipped { color: var(--dc-green); }
#dp .tag.adapter { color: var(--dp-warn); }

@media (max-width: 640px) {
  #dp .dp-layout { grid-template-columns: minmax(0, 1fr); }
  #dp .dp-preview { order: -1; }
}
@media (max-width: 380px) { #dp .dp-pair { grid-template-columns: 1fr; } #dp .dp-stage { padding: 14px 8px; } }
@media (pointer: coarse) { #dp select { min-height: 44px; font-size: 16px; } #dp .dp-check { min-height: 44px; } #dp .dp-seg span { padding: 11px 4px; } }
</style>
</head>
<body>
<div id="dp">
  <div class="dp-head">
    <h2>Discord card for Developer Presence</h2>
    <span class="dp-chip">Proposal · fictional sample data · not in current builds</span>
  </div>

  <div class="dp-layout">
    <form class="dp-config" id="dp-form" aria-label="Presence settings (proposal)">
      <fieldset class="dp-group">
        <legend>Desktop app</legend>
        <div class="dp-seg">
          <label><input type="radio" name="dp-app" value="t3" checked><span>T3 Code</span></label>
          <label><input type="radio" name="dp-app" value="claude"><span>Claude</span></label>
          <label><input type="radio" name="dp-app" value="codex"><span>Codex</span></label>
        </div>
        <p class="dp-hint" id="dp-app-hint"></p>
      </fieldset>

      <fieldset class="dp-group">
        <legend>Card shows</legend>
        <div class="dp-seg">
          <label><input type="radio" name="dp-preset" value="focus"><span>App only</span></label>
          <label><input type="radio" name="dp-preset" value="workload" checked><span>Workload</span></label>
          <label><input type="radio" name="dp-preset" value="usage"><span>Usage</span></label>
        </div>
      </fieldset>

      <div class="dp-group" id="dp-usage-group">
        <div class="dp-pair">
          <div><label class="dp-label" for="dp-metric">Metric</label>
            <select id="dp-metric">
              <option value="tokens">Cumulative tokens</option>
              <option value="context">Context window</option>
            </select></div>
          <div><label class="dp-label" for="dp-scope">Scope</label>
            <select id="dp-scope">
              <option value="session">Observed app session</option>
              <option value="thread">Pinned thread</option>
              <option value="today">Provider today</option>
            </select></div>
        </div>
        <p class="dp-hint" id="dp-scope-hint"></p>
      </div>

      <div class="dp-group" id="dp-badge-group">
        <label class="dp-label" for="dp-badge">Small badge (one slot)</label>
        <select id="dp-badge">
          <option value="status">Status: working, waiting, idle</option>
          <option value="provider">Provider of the pinned thread</option>
          <option value="none">None</option>
        </select>
      </div>

      <fieldset class="dp-group">
        <legend>Share</legend>
        <div class="dp-checks">
          <label class="dp-check" id="dp-row-project"><input type="checkbox" id="dp-project"><span>Project alias</span></label>
          <label class="dp-check" id="dp-row-model"><input type="checkbox" id="dp-model"><span>Model</span></label>
          <label class="dp-check" id="dp-row-cost"><input type="checkbox" id="dp-cost"><span>Est. API cost</span></label>
          <label class="dp-check"><input type="checkbox" id="dp-timer" checked><span>Elapsed timer</span></label>
          <label class="dp-check" id="dp-row-playful"><input type="checkbox" id="dp-playful"><span>Playful wording</span></label>
        </div>
      </fieldset>

      <div class="dp-group">
        <label class="dp-label" for="dp-buttons">Buttons (max 2)</label>
        <select id="dp-buttons">
          <option value="none">None</option>
          <option value="companion">Get Developer Presence</option>
          <option value="both">Companion + public repo</option>
        </select>
      </div>
    </form>

    <section class="dp-preview" aria-label="Discord preview">
      <div class="dp-bar" id="dp-bar">
        <label for="dp-sample">Sample state</label>
        <select id="dp-sample">
          <option value="attention">2 running, 1 waiting</option>
          <option value="working">3 running</option>
          <option value="idle">Idle</option>
        </select>
      </div>
      <div class="dp-stage">
        <div class="dc dc-card" aria-label="Mock Discord activity card">
          <div class="dc-top"><span class="dc-type">Playing</span><span class="dc-more" aria-hidden="true">···</span></div>
          <div class="dc-act">
            <div class="dc-art">
              <img id="dp-large" class="dc-large" alt="">
              <span id="dp-small" class="dc-small" hidden></span>
            </div>
            <div class="dc-text">
              <div class="dc-name">Developer Presence</div>
              <div id="dp-details" class="dc-line" aria-live="polite"></div>
              <div id="dp-state" class="dc-line" aria-live="polite"></div>
              <div id="dp-time" class="dc-time">
                <span aria-hidden="true">◷</span>
                <span id="dp-time-text">24:18</span>
              </div>
            </div>
          </div>
          <div id="dp-btns" class="dc-btns"></div>
        </div>
        <div class="dc dc-member" aria-label="Mock Discord member list row">
          <span class="dc-avatar" aria-hidden="true">S</span>
          <div class="dc-mtext"><div class="dc-mname">sample_dev</div>Playing <b>Developer Presence</b></div>
        </div>
      </div>
      <p id="dp-fit" class="dp-fit" role="status" hidden></p>
      <p id="dp-legend" class="dp-legend"></p>
      <details>
        <summary id="dp-payload-sum">Outgoing fields</summary>
        <dl id="dp-payload"></dl>
      </details>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('dp');
  const $ = id => document.getElementById('dp-' + id);
  const radio = name => root.querySelector(`input[name="dp-${name}"]:checked`).value;

  /* Follow the host's real background, not prefers-color-scheme: hosts may force a dark page while the OS reports light. */
  const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  function toRGBA(css) {
    probe.clearRect(0, 0, 1, 1); probe.fillStyle = '#000'; probe.fillStyle = css; probe.fillRect(0, 0, 1, 1);
    const [r, g, b, a] = probe.getImageData(0, 0, 1, 1).data; return { r, g, b, a: a / 255 };
  }
  function hostScheme() {
    for (let node = root.parentElement; node; node = node.parentElement) {
      const c = toRGBA(getComputedStyle(node).backgroundColor);
      if (c.a > 0.5) {
        const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
        return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b) < 0.2 ? 'dark' : 'light';
      }
    }
    const declared = getComputedStyle(document.documentElement).colorScheme.trim();
    if (declared === 'dark' || declared === 'light') return declared;
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  let schemeQueued = false;
  function applyScheme() {
    schemeQueued = false;
    const s = hostScheme();
    if (root.style.colorScheme !== s) root.style.colorScheme = s;
  }
  const queueScheme = () => { if (!schemeQueued) { schemeQueued = true; requestAnimationFrame(applyScheme); } };
  applyScheme();
  new MutationObserver(queueScheme).observe(document.documentElement, { attributes: true, childList: true, subtree: true, attributeFilter: ['class', 'style', 'data-theme', 'data-appearance'] });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', queueScheme);
