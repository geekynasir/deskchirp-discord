name: Native apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  computer-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test device selection and private HTTP protocol
        run: python3 -m unittest discover -s coordination/tests -v
      - name: Test native client services against the real coordination server
        run: python3 coordination/tests/native_http.py
      - uses: actions/upload-artifact@v4
        with:
          name: Deskchirp-linking-service
          path: |
            coordination/service.py
            coordination/README.md
            coordination/tests/test_service.py
            docs/computers.md
            spec/multiple-computers.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          retention-days: 14

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Check shared Swift fixture copies
        run: |
          cmp spec/presence-cases.json macos/Tests/DeveloperPresenceTests/Resources/presence-cases.json
          cmp spec/ipc-frames.json macos/Tests/DeveloperPresenceTests/Resources/ipc-frames.json
          cmp spec/t3-activity-cases.json macos/Tests/DeveloperPresenceTests/Resources/t3-activity-cases.json
          cmp spec/presence-v3-cases.json macos/Tests/DeveloperPresenceTests/Resources/presence-v3-cases.json
      - name: Test Swift implementation
        run: swift test --package-path macos
      - name: Build native app bundle
        run: bash macos/scripts/build-app.sh
      - name: Check app bundle metadata
        run: plutil -lint macos/dist/Deskchirp.app/Contents/Info.plist
      - name: Archive development app
        run: |
          codesign --verify --deep --strict macos/dist/Deskchirp.app
          cp LICENSE THIRD_PARTY_NOTICES.md macos/dist/
          cp -R licenses macos/dist/licenses
          cp docs/trying-builds.md macos/dist/READ-ME.md
          ditto -c -k --sequesterRsrc --keepParent macos/dist/Deskchirp.app macos/dist/Deskchirp-macos-${{ matrix.arch }}.zip
          cp docs/connect-t3.md macos/dist/CONNECT-T3.md
          cp docs/computers.md macos/dist/COMPUTERS.md
          cp -R assets/discord macos/dist/Discord-artwork
      - name: Capture native settings for review
        continue-on-error: true
        run: |
          open -n macos/dist/Deskchirp.app --args --show-settings --light-appearance
          sleep 4
          screencapture -x macos/dist/settings-light.png
          pkill -x Deskchirp || true
          open -n macos/dist/Deskchirp.app --args --show-settings --dark-appearance
          sleep 4
          screencapture -x macos/dist/settings-dark.png
          pkill -x Deskchirp || true
          open -n macos/dist/Deskchirp.app --args --show-settings --show-computers --light-appearance
          sleep 4
          screencapture -x macos/dist/settings-computers.png
      - uses: actions/upload-artifact@v4
        with:
          name: Deskchirp-macos-${{ matrix.arch }}
          path: |
            macos/dist/Deskchirp-macos-${{ matrix.arch }}.zip
            macos/dist/READ-ME.md
            macos/dist/CONNECT-T3.md
            macos/dist/COMPUTERS.md
            macos/dist/Discord-artwork/
            macos/dist/LICENSE
            macos/dist/THIRD_PARTY_NOTICES.md
            macos/dist/licenses/
            macos/dist/settings-*.png
          if-no-files-found: error
          retention-days: 14

  windows-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test portable C# protocol and privacy logic
        run: dotnet test windows/tests/DeveloperPresence.Tests/DeveloperPresence.Tests.csproj -c Release
      - name: Test saved settings presentation and compile shell helpers
        run: dotnet test checks/WindowsShell.Tests/WindowsShell.Tests.csproj -c Release

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish native WinUI application with runtimes
        shell: pwsh
        run: |
          $prefix, $suffix = (Get-Content VERSION -Raw).Trim() -split '-', 2
          dotnet publish windows/src/DeveloperPresence.App/DeveloperPresence.App.csproj `
            -c Release -p:Platform=x64 -r win-x64 `
            --self-contained true -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:VersionPrefix=$prefix -p:VersionSuffix=$suffix `
            -o dist/windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
      - name: Check executable and include instructions
        shell: pwsh
        run: |
          if (!(Test-Path dist/windows-x64/Deskchirp.exe)) { throw 'Application executable missing' }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/windows-x64/
          Copy-Item -Recurse licenses dist/windows-x64/licenses
          Copy-Item docs/trying-builds.md dist/windows-x64/READ-ME.md
          Copy-Item docs/connect-t3.md dist/windows-x64/CONNECT-T3.md
          Copy-Item docs/computers.md dist/windows-x64/COMPUTERS.md
          Copy-Item -Recurse assets/discord dist/windows-x64/Discord-artwork
      - name: Build one-click installer and update feed
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - name: Verify preview 3 replacement, update, Start launch and uninstall
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Capture the install window
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: ./scripts/capture-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Deskchirp-windows-installer
          path: dist/windows-installer/
          if-no-files-found: error
          retention-days: 14
      - name: Capture native settings for review
        continue-on-error: true
        shell: pwsh
        run: ./scripts/capture-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Deskchirp-windows-x64
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 14

# These jobs compile/test source. Real Discord, foreground identity, tray/menu,
# lock/sleep, accessibility, signing and clean-machine installation need the
# manual target-platform checks in docs/acceptance.md.

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [computer-coordination, macos, windows-core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and notes
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package checked builds and checksums
        shell: bash
        run: >-
          python3 scripts/package-release.py --artifacts artifacts --output release-assets
          --version "$(cat VERSION)" --commit "$GITHUB_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish release downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$(cat VERSION)" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "Deskchirp for Discord $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" "${release_flags[@]}"
